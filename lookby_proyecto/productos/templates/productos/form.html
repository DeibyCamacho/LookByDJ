{% extends 'base.html' %}
{% block title %}{{ titulo }} | LookBy{% endblock %}
{% block content %}
<div class="contenido">
  <h2>{{ titulo }}</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="acciones">
      <button type="submit">Guardar producto</button>
      {% if producto %}
        <a class="btn-secundario" href="{% url 'productos:detalle' producto.pk %}">Cancelar</a>
      {% else %}
        <a class="btn-secundario" href="{% url 'productos:lista' %}">Cancelar</a>
      {% endif %}
    </div>
  </form>
</div>
{% endblock %}
