{% extends 'base.html' %}
{% block title %}Entrar | LookBy{% endblock %}
{% block content %}
<h2>Iniciar sesión</h2>
<form method="post" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Entrar</button>
</form>
<p>¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}">Regístrate</a></p>
{% endblock %}
