{% extends 'base.html' %}
{% block title %}Cambiar contraseña | LookBy{% endblock %}
{% block content %}
<div class="contenido">
  <h2>Cambiar contraseña</h2>
  <p>Escribe tu contraseña actual y luego la nueva (mínimo 8 caracteres).</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-start">Guardar contraseña</button>
  </form>
</div>
{% endblock %}
