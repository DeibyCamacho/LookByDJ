{% extends 'base.html' %}
{% block title %}Reservar cita | LookBy{% endblock %}
{% block content %}
<div class="contenido">
<h2>Reservar una cita</h2>
<p>La duración y el precio se toman del servicio elegido.</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="acciones">
    <button type="submit">Reservar cita</button>
    <a class="btn-secundario" href="{% url 'citas:lista' %}">Volver a mis citas</a>
  </div>
</form>
</div>
{% endblock %}
