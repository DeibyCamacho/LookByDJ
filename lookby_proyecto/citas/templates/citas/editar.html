{% extends 'base.html' %}
{% block title %}Reprogramar cita | LookBy{% endblock %}
{% block content %}
<div class="contenido">
<h2>Reprogramar cita #{{ cita.id }}</h2>
<p>Fecha actual: {{ cita.fecha_inicio }}</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="acciones">
    <button type="submit">Guardar cambios</button>
    <a class="btn-secundario" href="{% url 'citas:detalle' cita.pk %}">Cancelar</a>
  </div>
</form>
</div>
{% endblock %}
