{% extends 'base.html' %}
{% block title %}{{ titulo }} | LookBy{% endblock %}
{% block content %}
<div class="contenido">
  <h2>{{ titulo }}</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="acciones">
      <button type="submit">Guardar inventario</button>
      {% if inventario %}
        <a class="btn-secundario" href="{% url 'inventario:detalle' inventario.pk %}">Cancelar</a>
      {% else %}
        <a class="btn-secundario" href="{% url 'inventario:lista' %}">Cancelar</a>
      {% endif %}
    </div>
  </form>
</div>
{% endblock %}
