{% extends 'base.html' %}
{% block title %}{{ titulo }} | LookBy{% endblock %}
{% block content %}
<div class="contenido">
  <h2>{{ titulo }}</h2>
  <p>Proveedor: <strong>{{ proveedor.nombre }}</strong></p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="acciones">
      <button type="submit">Guardar</button>
      <a class="btn-secundario" href="{% url 'proveedores:detalle' proveedor.pk %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
