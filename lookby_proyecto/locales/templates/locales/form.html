{% extends 'base.html' %}
{% block title %}{{ titulo }} | LookBy{% endblock %}
{% block content %}
<div class="contenido">
<h2>{{ titulo }}</h2>
<form method="post" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <div class="acciones">
    <button type="submit">Guardar local</button>
    <a class="btn-secundario" href="{% url 'locales:lista' %}">Cancelar</a>
  </div>
</form>
</div>
{% endblock %}
