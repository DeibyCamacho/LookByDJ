{% extends 'base.html' %}
{% block title %}{{ titulo }} | LookBy{% endblock %}
{% block content %}
<h2>{{ titulo }}</h2>
<form method="post" novalidate>
  {% csrf_token %}
  {{ form.as_p }}

  <a href="{% url 'locales:lista' %}">Cancelar</a>
</form>
{% endblock %}
