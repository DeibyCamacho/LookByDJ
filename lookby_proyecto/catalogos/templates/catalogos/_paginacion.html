{% if page_obj.paginator.num_pages > 1 %}
<nav class="paginacion" aria-label="Paginación">
  {% if page_obj.has_previous %}
    <a class="btn-accion" href="?{{ page_param|default:'page' }}={{ page_obj.previous_page_number }}">‹ Anterior</a>
  {% else %}
    <span class="btn-accion desactivado">‹ Anterior</span>
  {% endif %}
  <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="btn-accion" href="?{{ page_param|default:'page' }}={{ page_obj.next_page_number }}">Siguiente ›</a>
  {% endif %}
</nav>
{% endif %}
