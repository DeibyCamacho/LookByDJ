{% extends 'base.html' %}
{% block title %}{{ titulo }} | LookBy{% endblock %}
{% block content %}
<div class="contenido">
  <h2>{{ titulo }}</h2>
  <p>Catálogo: <strong>{{ catalogo.nombre }}</strong> ({{ catalogo.local.nombre }})</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="acciones">
      <button type="submit">Guardar</button>
      <a class="btn-secundario" href="{% url 'catalogos:detalle' catalogo.pk %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
